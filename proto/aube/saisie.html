<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mue — Saisie · Aube</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style type="text/tailwindcss">
    @theme { --font-sans: Inter, ui-sans-serif, system-ui, sans-serif; }
    [x-cloak]{display:none!important}.phone{width:min(100%,390px);height:min(844px,100dvh)}
    .ruler{background-image:repeating-linear-gradient(90deg,transparent 0 15px,#b7aa98 15px 16px);background-size:16px 24px;background-repeat:repeat-x;background-position-y:center}
  </style>
</head>
<body class="min-h-screen bg-[#dcd8ce] font-sans text-[#1b2b27] antialiased sm:flex sm:items-center sm:justify-center sm:p-6">
  <main class="phone relative flex flex-col overflow-hidden bg-[#fbf8f1] shadow-2xl sm:rounded-[2.7rem]" x-data="{weight:74.5,manual:false,date:new Date().toISOString().slice(0,10),drag:false,startX:0,startWeight:0,saved:false,start(e){this.drag=true;this.startX=e.clientX;this.startWeight=this.weight;e.currentTarget.setPointerCapture?.(e.pointerId)},move(e){if(!this.drag)return;this.weight=Math.min(250,Math.max(30,Math.round((this.startWeight-(e.clientX-this.startX)/80)*10)/10))},stop(){this.drag=false},save(){this.saved=true;setTimeout(()=>this.saved=false,1800)}}">
    <header class="flex items-center justify-between px-7 pb-2 pt-7">
      <a href="../index.html" class="text-sm font-black tracking-[.2em]">MUE</a>
      <button class="rounded-full bg-[#eee7dc] px-3 py-2 text-xs font-semibold text-[#6b685f]">Aujourd'hui</button>
    </header>

    <section class="flex flex-1 flex-col px-7 pt-8">
      <p class="text-sm text-[#7d7a70]">Bonjour Kris,</p>
      <h1 class="mt-1 text-3xl font-semibold tracking-[-.045em]">Où en es-tu aujourd'hui&nbsp;?</h1>

      <div class="mt-12 text-center">
        <button @click="manual=!manual" class="group inline-flex items-end gap-2" aria-label="Basculer la saisie manuelle">
          <span class="text-[4.7rem] font-medium leading-none tracking-[-.08em] tabular-nums" x-text="weight.toFixed(1).replace('.', ',')"></span>
          <span class="mb-2 text-lg text-[#8a877d]">kg</span>
        </button>
        <p class="mt-3 text-xs font-semibold tracking-wide text-[#a09a8e]" x-text="manual ? 'SAISIE AU CLAVIER' : 'FAIS GLISSER LA BALANCE'"></p>
      </div>

      <div x-show="!manual" x-transition.opacity class="mt-9 select-none touch-none" @pointerdown="start($event)" @pointermove="move($event)" @pointerup="stop()" @pointercancel="stop()">
        <div class="relative h-24 overflow-hidden cursor-ew-resize">
          <div class="ruler absolute inset-x-[-80px] top-6 h-14 transition-[background-position] duration-75" :style="`background-position-x:${-(weight*160)%80}px`"></div>
          <div class="absolute left-1/2 top-1 h-20 w-[2px] -translate-x-1/2 bg-[#e66f51]"><span class="absolute -bottom-1 -left-[4px] h-[10px] w-[10px] rounded-full bg-[#e66f51]"></span></div>
          <div class="absolute inset-x-0 bottom-0 flex justify-between px-5 text-[10px] font-semibold text-[#8e877c]"><span x-text="Math.floor(weight-1)+' kg'"></span><span x-text="Math.ceil(weight+1)+' kg'"></span></div>
        </div>
      </div>

      <div x-show="manual" x-cloak x-transition class="mt-10">
        <label class="block rounded-2xl bg-white px-5 py-4 ring-1 ring-[#ddd2c2] focus-within:ring-2 focus-within:ring-[#e66f51]">
          <span class="text-xs font-semibold text-[#8f887c]">Poids en kilogrammes</span>
          <input type="number" min="30" max="250" step="0.1" x-model.number="weight" inputmode="decimal" class="mt-1 w-full bg-transparent text-3xl font-semibold outline-none">
        </label>
      </div>

      <div class="mt-auto pb-5">
        <label class="flex items-center justify-between rounded-2xl bg-[#f1ece3] px-4 py-3">
          <span><span class="block text-xs text-[#928b80]">Date de la mesure</span><span class="mt-0.5 block text-sm font-semibold">Modifier la date</span></span>
          <input type="date" x-model="date" class="max-w-36 bg-transparent text-sm font-semibold outline-none">
        </label>
        <button @click="save()" class="mt-3 w-full rounded-2xl bg-[#183f37] py-4 text-sm font-bold text-white shadow-[0_12px_28px_rgba(24,63,55,.25)] transition active:scale-[.98]" x-text="saved ? 'Enregistré ✓' : 'Enregistrer la mesure'"></button>
      </div>
    </section>

    <nav class="grid grid-cols-3 border-t border-[#e9e2d6] bg-[#fffdf8] px-5 py-3 text-center text-[11px] font-semibold">
      <a class="text-[#e66f51]" href="./saisie.html"><span class="mx-auto mb-1 block h-1.5 w-1.5 rounded-full bg-current"></span>Saisie</a>
      <a class="text-[#9c988f]" href="./evolution.html"><span class="mx-auto mb-1 block h-1.5 w-1.5 rounded-full border border-current"></span>Évolution</a>
      <a class="text-[#9c988f]" href="./profil.html"><span class="mx-auto mb-1 block h-1.5 w-1.5 rounded-full border border-current"></span>Profil</a>
    </nav>
  </main>
</body>
</html>
