      <div class="mt-5 border-2 border-black bg-white p-4 shadow-[7px_7px_0_#273cff]"><div class="flex items-end"><strong class="text-6xl font-black tracking-[-.08em]">74,5</strong><span class="mb-2 ml-2 text-xs font-black">KG</span></div><canvas x-ref="chart" class="mt-3 h-44 w-full"></canvas><div class="flex justify-between text-[10px] font-black"><span>25.07</span><span>AUJ.</span></div></div>
