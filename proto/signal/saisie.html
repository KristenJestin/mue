<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mue — Saisie · Signal</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style type="text/tailwindcss">@theme{--font-sans:Arial,Helvetica,sans-serif}[x-cloak]{display:none!important}.phone{width:min(100%,390px);height:min(844px,100dvh)}.ruler{background-image:repeating-linear-gradient(90deg,transparent 0 13px,#121212 13px 15px);background-size:15px 44px;background-repeat:repeat-x;background-position-y:center}</style>
</head>
<body class="min-h-screen bg-[#d7d7d3] text-[#121212] antialiased sm:flex sm:items-center sm:justify-center sm:p-6">
  <main class="phone relative flex flex-col overflow-hidden bg-[#fdfdf8] shadow-2xl sm:rounded-[2.7rem]" x-data="{weight:74.5,manual:false,date:new Date().toISOString().slice(0,10),drag:false,startX:0,startWeight:0,saved:false,start(e){this.drag=true;this.startX=e.clientX;this.startWeight=this.weight;e.currentTarget.setPointerCapture?.(e.pointerId)},move(e){if(!this.drag)return;this.weight=Math.min(250,Math.max(30,Math.round((this.startWeight-(e.clientX-this.startX)/80)*10)/10))},stop(){this.drag=false},save(){this.saved=true;setTimeout(()=>this.saved=false,1700)}}">
    <div class="absolute right-[-62px] top-[-72px] h-44 w-44 rounded-full bg-[#ff5b35]"></div>
    <header class="relative flex items-center justify-between px-6 pb-2 pt-7"><a href="../index.html" class="text-sm font-black tracking-[.18em]">MUE®</a><button @click="manual=!manual" class="grid h-10 w-10 place-items-center border-2 border-black bg-white text-xs font-black shadow-[4px_4px_0_#121212] transition active:translate-x-1 active:translate-y-1 active:shadow-none" x-text="manual?'R':'K'"></button></header>
    <section class="relative flex flex-1 flex-col px-6 pt-8">
      <p class="text-xs font-black tracking-[.18em] text-[#273cff]">DIM. 23 AOÛT</p><h1 class="mt-2 max-w-64 text-4xl font-black leading-[.98] tracking-[-.06em]">Une mesure.<br>Un repère.</h1>
      <div class="mt-11"><div class="flex items-end"><span class="text-[6.2rem] font-black leading-none tracking-[-.1em] text-[#273cff] tabular-nums" x-text="weight.toFixed(1).replace('.',',')"></span><span class="mb-3 ml-2 text-lg font-black">KG</span></div><p class="mt-3 inline-block bg-[#121212] px-3 py-1.5 text-[10px] font-black tracking-wider text-white" x-text="manual?'SAISIE DIRECTE':'GLISSER LA RÈGLE'"></p></div>
      <div x-show="!manual" x-transition.opacity class="mt-8 select-none touch-none" @pointerdown="start($event)" @pointermove="move($event)" @pointerup="stop()" @pointercancel="stop()"><div class="relative h-28 cursor-ew-resize overflow-hidden border-y-2 border-black"><div class="ruler absolute inset-x-[-70px] top-6 h-16" :style="`background-position-x:${-(weight*150)%75}px`"></div><div class="absolute left-1/2 top-0 h-full w-1 -translate-x-1/2 bg-[#ff5b35]"></div><div class="absolute inset-x-0 bottom-2 flex justify-between text-[10px] font-black"><span x-text="Math.floor(weight-1)"></span><span x-text="Math.ceil(weight+1)"></span></div></div></div>
      <div x-show="manual" x-cloak x-transition class="mt-8 border-2 border-black bg-white p-4 shadow-[7px_7px_0_#273cff]"><label class="text-[10px] font-black tracking-wider">POIDS EN KILOGRAMMES</label><input type="number" min="30" max="250" step="0.1" x-model.number="weight" inputmode="decimal" class="mt-2 w-full bg-transparent text-4xl font-black outline-none"></div>
      <div class="mt-auto pb-5"><label class="flex items-center justify-between border-2 border-black bg-[#f4f1e8] px-4 py-3"><span class="text-xs font-black tracking-wide">DATE</span><input type="date" x-model="date" class="max-w-40 bg-transparent text-xs font-bold outline-none"></label><button @click="save()" class="mt-3 flex w-full items-center justify-between bg-[#273cff] px-5 py-4 text-sm font-black text-white shadow-[7px_7px_0_#121212] transition active:translate-x-1 active:translate-y-1 active:shadow-none"><span x-text="saved?'C’EST NOTÉ !':'ENREGISTRER'"></span><span x-text="saved?'✓':'↗'"></span></button></div>
    </section>
    <nav class="grid grid-cols-3 border-t-2 border-black bg-white px-4 py-3 text-center text-[10px] font-black tracking-wider"><a class="text-[#273cff]" href="./saisie.html">01<br>SAISIE</a><a href="./evolution.html">02<br>COURBE</a><a href="./profil.html">03<br>PROFIL</a></nav>
  </main>
</body>
</html>
