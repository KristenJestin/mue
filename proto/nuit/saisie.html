<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mue — Saisie · Nuit</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style type="text/tailwindcss">@theme{--font-sans:Inter,ui-sans-serif,system-ui,sans-serif}[x-cloak]{display:none!important}.phone{width:min(100%,390px);height:min(844px,100dvh)}.ruler{background-image:repeating-linear-gradient(90deg,transparent 0 11px,rgba(255,255,255,.22) 11px 12px);background-size:12px 38px;background-repeat:repeat-x;background-position-y:center}</style>
</head>
<body class="min-h-screen bg-[#222426] text-white antialiased sm:flex sm:items-center sm:justify-center sm:p-6">
  <main class="phone relative flex flex-col overflow-hidden bg-[#090a0b] shadow-2xl sm:rounded-[2.7rem]" x-data="{weight:74.5,manual:false,date:new Date().toISOString().slice(0,10),drag:false,startX:0,startWeight:0,saved:false,start(e){this.drag=true;this.startX=e.clientX;this.startWeight=this.weight;e.currentTarget.setPointerCapture?.(e.pointerId)},move(e){if(!this.drag)return;this.weight=Math.min(250,Math.max(30,Math.round((this.startWeight-(e.clientX-this.startX)/80)*10)/10))},stop(){this.drag=false},save(){this.saved=true;setTimeout(()=>this.saved=false,1800)}}">
    <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_50%_33%,rgba(200,255,69,.09),transparent_38%)]"></div>
    <header class="relative flex items-center justify-between px-6 pb-2 pt-7"><a href="../index.html" class="text-sm font-black tracking-[.24em]">MUE/</a><div class="flex items-center gap-2 text-[10px] font-bold tracking-wider text-white/45"><span class="h-1.5 w-1.5 rounded-full bg-[#c8ff45] shadow-[0_0_12px_#c8ff45]"></span>LOCAL</div></header>
    <section class="relative flex flex-1 flex-col px-6 pt-8">
      <div class="flex items-center justify-between"><div><p class="text-[10px] font-bold tracking-[.2em] text-white/35 uppercase">Mesure du jour</p><h1 class="mt-2 text-2xl font-medium tracking-[-.04em]">Calibre ton instant.</h1></div><button @click="manual=!manual" class="grid h-11 w-11 place-items-center rounded-full border border-white/10 bg-white/[.04] text-xs font-bold transition hover:bg-white/10" x-text="manual?'↔':'⌨'"></button></div>
      <div class="mt-15 text-center"><div class="flex items-end justify-center gap-2"><span class="text-[5.8rem] font-extralight leading-none tracking-[-.09em] tabular-nums" x-text="weight.toFixed(1)"></span><span class="mb-3 text-xs font-bold tracking-[.2em] text-white/35">KG</span></div><p class="mt-4 text-[10px] font-bold tracking-[.24em] text-[#c8ff45]" x-text="manual?'ENTRÉE DIRECTE':'GLISSER POUR AJUSTER'"></p></div>
      <div x-show="!manual" x-transition.opacity class="mt-10 select-none touch-none" @pointerdown="start($event)" @pointermove="move($event)" @pointerup="stop()" @pointercancel="stop()">
        <div class="relative h-28 cursor-ew-resize overflow-hidden"><div class="ruler absolute inset-x-[-70px] top-5 h-16" :style="`background-position-x:${-(weight*120)%60}px`"></div><div class="absolute left-1/2 top-0 h-21 w-px -translate-x-1/2 bg-[#c8ff45] shadow-[0_0_14px_#c8ff45]"><span class="absolute -bottom-1 -left-[3px] h-[7px] w-[7px] rotate-45 bg-[#c8ff45]"></span></div><div class="absolute inset-x-0 bottom-0 flex justify-between text-[9px] font-bold tracking-widest text-white/25"><span x-text="(weight-1).toFixed(1)"></span><span x-text="(weight+1).toFixed(1)"></span></div></div>
      </div>
      <div x-show="manual" x-cloak x-transition class="mt-10"><label class="block border-b border-[#c8ff45] bg-white/[.03] px-4 py-3"><span class="text-[10px] font-bold tracking-widest text-white/35">POIDS EN KG</span><input autofocus type="number" min="30" max="250" step="0.1" x-model.number="weight" inputmode="decimal" class="mt-1 w-full bg-transparent text-3xl font-light outline-none"></label></div>
      <div class="mt-auto pb-5"><label class="flex items-center justify-between border-t border-white/10 py-4"><span><span class="block text-[9px] font-bold tracking-[.2em] text-white/30">DATE</span><span class="mt-1 block text-sm font-medium">Mesure datée</span></span><input type="date" x-model="date" class="max-w-36 rounded-lg bg-white/[.06] px-2 py-2 text-xs font-semibold text-white [color-scheme:dark] outline-none"></label><button @click="save()" class="mt-2 flex w-full items-center justify-between rounded-full bg-[#c8ff45] px-6 py-4 text-sm font-black text-black transition active:scale-[.98]"><span x-text="saved?'MESURE ENREGISTRÉE':'VALIDER LA MESURE'"></span><span x-text="saved?'✓':'→'"></span></button></div>
    </section>
    <nav class="relative grid grid-cols-3 border-t border-white/8 bg-[#0c0d0e] px-5 py-3 text-center text-[10px] font-bold tracking-wide"><a class="text-[#c8ff45]" href="./saisie.html"><span class="mx-auto mb-1 block h-[2px] w-5 bg-current"></span>MESURE</a><a class="text-white/30" href="./evolution.html"><span class="mx-auto mb-1 block h-[2px] w-5 bg-current"></span>COURBE</a><a class="text-white/30" href="./profil.html"><span class="mx-auto mb-1 block h-[2px] w-5 bg-current"></span>PROFIL</a></nav>
  </main>
</body>
</html>
