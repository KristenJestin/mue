<body class="min-h-screen bg-[#222426] text-white antialiased sm:flex sm:items-center sm:justify-center sm:p-6">
  <main class="phone relative flex flex-col overflow-hidden bg-[#090a0b] shadow-2xl sm:rounded-[2.7rem]" x-data="{period:'30J',periods:['7J','30J','3M','TOUT'],points:[75.6,75.1,75.2,74.8,74.9,74.5],draw(){let c=this.$refs.chart,x=c.getContext('2d'),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;x.scale(d,d);x.clearRect(0,0,w,h);let p=10,min=74.2,max=75.9,px=i=>p+i*(w-p*2)/(this.points.length-1),py=v=>p+(max-v)*(h-p*2)/(max-min);x.strokeStyle='rgba(255,255,255,.07)';x.lineWidth=1;[.2,.5,.8].forEach(k=>{x.beginPath();x.moveTo(0,h*k);x.lineTo(w,h*k);x.stroke()});let g=x.createLinearGradient(0,0,w,0);g.addColorStop(0,'#4bd4ff');g.addColorStop(1,'#c8ff45');x.beginPath();this.points.forEach((v,i)=>i?x.lineTo(px(i),py(v)):x.moveTo(px(i),py(v)));x.strokeStyle=g;x.lineWidth=3;x.shadowColor='#c8ff45';x.shadowBlur=12;x.stroke();x.shadowBlur=0;this.points.forEach((v,i)=>{x.beginPath();x.arc(px(i),py(v),i===5?5:2.5,0,Math.PI*2);x.fillStyle=i===5?'#c8ff45':'#4bd4ff';x.fill()})}}" x-init="$nextTick(()=>draw())">
    <header class="flex items-center justify-between px-6 pb-2 pt-7"><a href="../index.html" class="text-sm font-black tracking-[.24em]">MUE/</a><span class="text-[10px] font-bold tracking-[.2em] text-white/35">ANALYSE</span></header>
    <section class="flex-1 overflow-y-auto px-6 pb-5 pt-7">
      <div class="flex items-end justify-between"><div><p class="text-[10px] font-bold tracking-[.2em] text-[#c8ff45]">TRAJECTOIRE</p><h1 class="mt-2 text-3xl font-light tracking-[-.05em]">Tu avances.</h1></div><div class="text-right"><div class="text-3xl font-light">−1.1</div><span class="text-[9px] font-bold tracking-widest text-white/30">KG / 30J</span></div></div>
      <div class="mt-7 grid grid-cols-4 border-y border-white/8 py-2"><template x-for="p in periods"><button @click="period=p;draw()" class="py-2 text-[10px] font-bold tracking-wider transition" :class="period===p?'text-[#c8ff45]':'text-white/25'" x-text="p"></button></template></div>
      <div class="mt-6"><div class="flex items-end gap-2"><span class="text-6xl font-extralight tracking-[-.08em]">74.5</span><span class="mb-2 text-[10px] font-bold tracking-widest text-white/30">KG</span></div><canvas x-ref="chart" class="mt-6 h-52 w-full"></canvas><div class="flex justify-between text-[9px] font-bold tracking-widest text-white/25"><span>25.07</span><span>23.08</span></div></div>
      <div class="mt-6 grid grid-cols-3 gap-px overflow-hidden rounded-2xl bg-white/10"><div class="bg-[#111315] p-4"><span class="text-[9px] font-bold tracking-widest text-white/25">IMC</span><strong class="mt-2 block text-2xl font-light">23.0</strong></div><div class="bg-[#111315] p-4"><span class="text-[9px] font-bold tracking-widest text-white/25">RYTHME</span><strong class="mt-2 block text-2xl font-light">−0.3</strong></div><div class="bg-[#111315] p-4"><span class="text-[9px] font-bold tracking-widest text-white/25">ENTRÉES</span><strong class="mt-2 block text-2xl font-light">18</strong></div></div>
      <div class="mt-6"><div class="mb-2 flex justify-between text-[9px] font-bold tracking-[.2em] text-white/30"><span>MESURES RÉCENTES</span><span>VOIR TOUT →</span></div><div class="flex items-center justify-between border-t border-white/8 py-3 text-sm"><span class="text-white/45">23 AOÛT</span><strong>74.5 KG</strong></div><div class="flex items-center justify-between border-t border-white/8 py-3 text-sm"><span class="text-white/45">18 AOÛT</span><strong>74.9 KG</strong></div></div>
    </section>
