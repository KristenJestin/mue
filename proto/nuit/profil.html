<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mue — Profil · Nuit</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style type="text/tailwindcss">@theme{--font-sans:Inter,ui-sans-serif,system-ui,sans-serif}.phone{width:min(100%,390px);height:min(844px,100dvh)}</style>
</head>
<body class="min-h-screen bg-[#222426] text-white antialiased sm:flex sm:items-center sm:justify-center sm:p-6">
  <main class="phone flex flex-col overflow-hidden bg-[#090a0b] shadow-2xl sm:rounded-[2.7rem]" x-data="{birth:'1992-04-16',height:180,weight:74.5,saved:false,get age(){let b=new Date(this.birth),n=new Date();return n.getFullYear()-b.getFullYear()-((n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))?1:0)},get bmi(){return (this.weight/((this.height/100)**2)).toFixed(1)},save(){this.saved=true;setTimeout(()=>this.saved=false,1600)}}">
    <header class="flex items-center justify-between px-6 pb-2 pt-7"><a href="../index.html" class="text-sm font-black tracking-[.24em]">MUE/</a><span class="text-[10px] font-bold tracking-[.2em] text-white/35">IDENTITÉ</span></header>
    <section class="flex-1 overflow-y-auto px-6 pb-5 pt-7">
      <p class="text-[10px] font-bold tracking-[.2em] text-[#c8ff45]">PROFIL SANTÉ</p><h1 class="mt-2 text-3xl font-light tracking-[-.05em]">Tes constantes.</h1>
      <div class="relative mt-7 overflow-hidden rounded-[1.7rem] border border-white/10 bg-[#111315] p-5"><div class="absolute right-[-35px] top-[-45px] h-36 w-36 rounded-full border-[22px] border-[#c8ff45]/10"></div><div class="relative"><span class="text-[9px] font-bold tracking-[.2em] text-white/30">IMC ACTUEL</span><div class="mt-2 flex items-end gap-2"><strong class="text-6xl font-extralight tracking-[-.07em]" x-text="bmi"></strong><span class="mb-2 rounded-full bg-[#c8ff45] px-2 py-1 text-[9px] font-black text-black">HABITUEL</span></div><div class="mt-6 flex h-1.5 overflow-hidden rounded-full"><span class="w-1/4 bg-[#4bd4ff]"></span><span class="w-2/5 bg-[#c8ff45]"></span><span class="flex-1 bg-[#ff8c54]"></span></div><p class="mt-4 text-xs leading-5 text-white/38">Un repère général calculé à partir de ta taille et de ton dernier poids.</p></div></div>
      <div class="mt-6 space-y-px overflow-hidden rounded-2xl bg-white/10"><label class="block bg-[#111315] px-4 py-4"><span class="text-[9px] font-bold tracking-[.2em] text-white/25">DATE DE NAISSANCE</span><div class="mt-2 flex items-center justify-between"><input type="date" x-model="birth" class="bg-transparent text-sm font-semibold text-white [color-scheme:dark] outline-none"><span class="text-xs text-[#c8ff45]" x-text="age+' ANS'"></span></div></label><label class="block bg-[#111315] px-4 py-4"><span class="text-[9px] font-bold tracking-[.2em] text-white/25">TAILLE</span><div class="mt-1 flex items-end"><input type="number" min="120" max="230" x-model.number="height" class="w-full bg-transparent text-3xl font-light outline-none"><span class="mb-1 text-xs text-white/30">CM</span></div></label></div>
      <button @click="save()" class="mt-5 flex w-full items-center justify-between rounded-full bg-[#c8ff45] px-6 py-4 text-sm font-black text-black transition active:scale-[.98]"><span x-text="saved?'PROFIL ENREGISTRÉ':'SAUVEGARDER LE PROFIL'"></span><span x-text="saved?'✓':'→'"></span></button>
      <p class="mt-5 border-l border-white/15 pl-4 text-xs leading-5 text-white/35">L'IMC est un indicateur général et ne constitue pas un diagnostic médical. Les données restent locales dans la première version.</p>
    </section>
    <nav class="grid grid-cols-3 border-t border-white/8 bg-[#0c0d0e] px-5 py-3 text-center text-[10px] font-bold tracking-wide"><a class="text-white/30" href="./saisie.html"><span class="mx-auto mb-1 block h-[2px] w-5 bg-current"></span>MESURE</a><a class="text-white/30" href="./evolution.html"><span class="mx-auto mb-1 block h-[2px] w-5 bg-current"></span>COURBE</a><a class="text-[#c8ff45]" href="./profil.html"><span class="mx-auto mb-1 block h-[2px] w-5 bg-current"></span>PROFIL</a></nav>
  </main>
</body>
</html>
