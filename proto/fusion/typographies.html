<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mue — Typography test</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Manrope:wght@400..800&family=Sora:wght@400..700&family=Space+Grotesk:wght@400..700&display=swap');</style>
  <style type="text/tailwindcss">[x-cloak]{display:none!important}.phone{width:min(100%,390px);height:min(844px,100dvh)}.ruler{background-image:repeating-linear-gradient(90deg,transparent 0 15px,rgba(255,255,255,.24) 15px 16px);background-size:16px 25px;background-repeat:repeat-x;background-position-y:center}</style>
</head>
<body class="min-h-screen bg-[#252527] text-white antialiased sm:flex sm:items-center sm:justify-center sm:p-6">
  <main class="phone relative flex flex-col overflow-hidden bg-[#101012] shadow-2xl sm:rounded-[2.7rem]" x-data="{current:2,fonts:[{name:'Manrope',family:'Manrope',note:'Warm, clear and quietly distinctive.'},{name:'DM Sans',family:'DM Sans',note:'Neutral and effortless, with very readable numbers.'},{name:'Sora',family:'Sora',note:'Selected for Mue: geometric and distinctive without feeling clinical.'},{name:'Space Grotesk',family:'Space Grotesk',note:'Sharper and more editorial, with a stronger personality.'}],get font(){return this.fonts[this.current]}}" :style="`font-family:'${font.family}',sans-serif`">
    <div class="pointer-events-none absolute inset-x-0 top-0 h-72 opacity-20" style="background:radial-gradient(circle at 50% 0,#efb45f,transparent 65%)"></div>
    <header class="relative flex items-center justify-between px-7 pb-2 pt-7"><a href="../index.html" class="text-sm font-extrabold tracking-[.2em]">MUE</a><a href="./saisie.html" class="text-xs font-semibold text-white/40">Back to prototype</a></header>
    <section class="relative flex flex-1 flex-col px-7 pt-7">
      <p class="text-[10px] font-bold tracking-[.18em] text-[#efb45f] uppercase">Typography test</p>
      <div class="mt-3 grid grid-cols-2 gap-2"><template x-for="(item,index) in fonts" :key="item.name"><button @click="current=index" class="rounded-xl border px-3 py-3 text-left text-xs font-bold transition" :class="current===index?'border-[#efb45f] bg-[#33291e] text-[#efb45f]':'border-white/8 bg-white/[.03] text-white/45'" :style="`font-family:'${item.family}',sans-serif`" x-text="item.name"></button></template></div>
      <div class="mt-7"><p class="text-sm text-white/45">Hello Kris,</p><h1 class="mt-1 text-3xl font-semibold tracking-[-.045em]">Where are you today?</h1><p class="mt-3 min-h-10 text-xs leading-5 text-white/35" x-text="font.note"></p></div>
      <div class="mt-9 text-center"><div class="inline-flex items-end gap-2"><span class="text-[4.8rem] font-medium leading-none tracking-[-.08em] tabular-nums">74.5</span><span class="mb-2 text-lg text-white/35">kg</span></div><p class="mt-3 text-[10px] font-bold tracking-[.2em] text-[#efb45f]">SLIDE TO ADJUST</p></div>
      <div class="mt-7"><div class="relative h-24 overflow-hidden"><div class="ruler absolute inset-x-[-80px] top-6 h-14"></div><div class="absolute left-1/2 top-1 h-20 w-[2px] -translate-x-1/2 bg-[#efb45f] shadow-[0_0_14px_rgba(239,180,95,.45)]"><span class="absolute -bottom-1 -left-[4px] h-[10px] w-[10px] rounded-full bg-[#efb45f]"></span></div><div class="absolute inset-x-0 bottom-0 flex justify-between px-5 text-[10px] font-semibold text-white/28"><span>73 kg</span><span>76 kg</span></div></div></div>
      <div class="mt-auto pb-5"><div class="rounded-2xl border border-white/8 bg-white/[.035] px-4 py-3"><span class="block text-xs text-white/35">Measurement date</span><span class="mt-0.5 block text-sm font-semibold">August 23, 2026</span></div><button class="mt-3 w-full rounded-2xl bg-[#efb45f] py-4 text-sm font-bold text-[#1d160d]">Save measurement</button></div>
    </section>
  </main>
</body>
</html>
