<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mue — Entry · Amber</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400..700&display=swap');</style>
  <style type="text/tailwindcss">
    @theme { --font-sans: Sora, ui-sans-serif, system-ui, sans-serif; }
    [x-cloak]{display:none!important}.phone{width:min(100%,390px);height:min(844px,100dvh)}
    .ruler{background-image:repeating-linear-gradient(90deg,transparent 0 15px,rgba(255,255,255,.24) 15px 16px);background-size:16px 25px;background-repeat:repeat-x;background-position-y:center}
  </style>
</head>
<body class="min-h-screen bg-[#252527] font-sans text-white antialiased sm:flex sm:items-center sm:justify-center sm:p-6">
  <main
    class="phone relative flex flex-col overflow-hidden bg-[#101012] shadow-2xl sm:rounded-[2.7rem]"
    x-data="{
      timerActive:new URLSearchParams(window.location.search).get('timer')==='active',
      weight:74.5, manual:false, date:new Date().toISOString().slice(0,10), drag:false, startX:0, startWeight:0, saved:false,
      start(e){this.drag=true;this.startX=e.clientX;this.startWeight=this.weight;e.currentTarget.setPointerCapture?.(e.pointerId)},
      move(e){if(!this.drag)return;this.weight=Math.min(250,Math.max(30,Math.round((this.startWeight-(e.clientX-this.startX)/80)*10)/10))},
      stop(){this.drag=false}, save(){this.saved=true;setTimeout(()=>this.saved=false,1700)}
    }"
    x-init="$nextTick(() => lucide.createIcons())"
    style="--accent:#efb45f;--soft:#33291e;--ink:#1d160d"
  >
    <div class="pointer-events-none absolute inset-x-0 top-0 h-80 opacity-30" style="background:radial-gradient(circle at 50% 0,var(--accent),transparent 65%)"></div>
    <header class="relative flex items-center justify-between px-7 pb-2 pt-7">
      <a href="../index.html" class="text-sm font-black tracking-[.2em]">MUE</a>
      <span class="rounded-full border border-white/10 bg-white/[.04] px-3 py-2 text-xs font-semibold text-white/55">Today</span>
    </header>

    <section class="relative flex flex-1 flex-col px-7 pt-10">
      <p class="text-sm text-white/45">Hello Kris,</p>
      <h1 class="mt-1 text-3xl font-semibold tracking-[-.045em]">Where are you today?</h1>

      <div class="mt-10 text-center">
        <button @click="manual=!manual" class="inline-flex items-end gap-2" aria-label="Toggle manual entry">
          <span class="text-[4.8rem] font-medium leading-none tracking-[-.08em] tabular-nums" x-text="weight.toFixed(1).replace('.', ',')"></span>
          <span class="mb-2 text-lg text-white/35">kg</span>
        </button>
        <p class="mt-3 text-[10px] font-bold tracking-[.2em] text-[#efb45f]" x-text="manual?'TYPE YOUR WEIGHT':'SLIDE TO ADJUST'"></p>
      </div>

      <div x-show="!manual" x-transition.opacity class="mt-7 select-none touch-none" @pointerdown="start($event)" @pointermove="move($event)" @pointerup="stop()" @pointercancel="stop()">
        <div class="relative h-24 cursor-ew-resize overflow-hidden">
          <div class="ruler absolute inset-x-[-80px] top-6 h-14" :style="`background-position-x:${-(weight*160)%80}px`"></div>
          <div class="absolute left-1/2 top-1 h-20 w-[2px] -translate-x-1/2 bg-[#efb45f] shadow-[0_0_14px_rgba(239,180,95,.45)]"><span class="absolute -bottom-1 -left-[4px] h-[10px] w-[10px] rounded-full bg-[#efb45f]"></span></div>
          <div class="absolute inset-x-0 bottom-0 flex justify-between px-5 text-[10px] font-semibold text-white/28"><span x-text="Math.floor(weight-1)+' kg'"></span><span x-text="Math.ceil(weight+1)+' kg'"></span></div>
        </div>
      </div>

      <div x-show="manual" x-cloak x-transition class="mt-8">
        <label class="block rounded-2xl border border-white/10 bg-white/[.04] px-5 py-4 focus-within:border-white/35">
          <span class="text-xs font-semibold text-white/35">Weight in kilograms</span>
          <input type="number" min="30" max="250" step="0.1" x-model.number="weight" inputmode="decimal" class="mt-1 w-full bg-transparent text-3xl font-semibold outline-none">
        </label>
      </div>

      <div class="mt-auto pb-5">
        <label class="flex items-center justify-between rounded-2xl border border-white/8 bg-white/[.035] px-4 py-3">
          <span><span class="block text-xs text-white/35">Measurement date</span><span class="mt-0.5 block text-sm font-semibold">Change date</span></span>
          <input type="date" x-model="date" class="max-w-36 rounded-lg bg-transparent text-sm font-semibold text-white [color-scheme:dark] outline-none">
        </label>
        <button @click="save()" class="mt-3 w-full rounded-2xl bg-[#efb45f] py-4 text-sm font-bold text-[#1d160d] shadow-[0_12px_30px_rgba(239,180,95,.14)] transition active:scale-[.98]" x-text="saved?'Saved ✓':'Save measurement'"></button>
      </div>
    </section>

    <a x-show="timerActive" x-cloak href="./active-activity.html" class="mx-3 mb-2 flex items-center gap-3 rounded-2xl border border-[#efb45f]/30 bg-[#2d261d] px-3 py-2.5 shadow-[0_10px_30px_rgba(0,0,0,.28)]"><span class="grid h-9 w-9 place-items-center rounded-xl bg-[#efb45f] text-[#1d160d]"><i data-lucide="footprints" class="h-4 w-4"></i></span><span class="min-w-0 flex-1"><strong class="block text-[10px]">Treadmill walk</strong><span class="mt-0.5 block text-[9px] text-white/35">Activity in progress</span></span><span class="font-mono text-xs font-semibold tabular-nums text-[#efb45f]">25:43</span><i data-lucide="chevron-right" class="h-3.5 w-3.5 text-white/20"></i></a>

    <nav class="relative grid grid-cols-5 border-t border-white/8 bg-[#121214] px-2 py-2 text-center text-[8px] font-semibold">
      <a :href="timerActive?'./saisie.html?timer=active':'./saisie.html'" class="flex flex-col items-center gap-1 text-[#efb45f]"><i data-lucide="scale" class="h-[18px] w-[18px]" stroke-width="2.5"></i><span>Entry</span></a>
      <a :href="timerActive?'./evolution.html?timer=active':'./evolution.html'" class="flex flex-col items-center gap-1 text-white/28 transition hover:text-white/60"><i data-lucide="chart-no-axes-combined" class="h-[18px] w-[18px]"></i><span>Progress</span></a>
      <a :href="timerActive?'./activity.html?timer=active':'./activity.html'" class="flex flex-col items-center gap-1 text-white/28 transition hover:text-white/60"><i data-lucide="activity" class="h-[18px] w-[18px]"></i><span>Activity</span></a>
      <a :href="timerActive?'./food.html?timer=active':'./food.html'" class="flex flex-col items-center gap-1 text-white/28 transition hover:text-white/60"><i data-lucide="utensils" class="h-[18px] w-[18px]"></i><span>Food</span></a>
      <a :href="timerActive?'./profil.html?timer=active':'./profil.html'" class="flex flex-col items-center gap-1 text-white/28 transition hover:text-white/60"><i data-lucide="user-round" class="h-[18px] w-[18px]"></i><span>Profile</span></a>
    </nav>
  </main>
</body>
</html>
