<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mue — Strength session · Amber</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400..700&display=swap');</style>
  <style type="text/tailwindcss">
    @theme { --font-sans: Sora, ui-sans-serif, system-ui, sans-serif; }
    [x-cloak] { display: none !important; }
    .phone { width: min(100%, 390px); height: min(844px, 100dvh); }
    .card-in { animation: card-in .38s cubic-bezier(.2,.8,.2,1) both; }
    .new-set { animation: new-set .7s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes card-in { from { opacity:0; transform:translateY(12px) scale(.98); } to { opacity:1; transform:none; } }
    @keyframes new-set { 0% { background:rgba(239,180,95,.22); transform:scale(.98); } 100% { background:transparent; transform:none; } }
    @media (prefers-reduced-motion: reduce) { .card-in,.new-set { animation:none !important; } }
  </style>
</head>
<body class="min-h-screen bg-[#252527] font-sans text-white antialiased sm:flex sm:items-center sm:justify-center sm:p-6">
  <main class="phone relative flex flex-col overflow-hidden bg-[#101012] shadow-2xl sm:rounded-[2.7rem]" x-data="strengthLog()" x-init="$nextTick(() => lucide.createIcons())">
    <div class="pointer-events-none absolute inset-x-0 top-0 h-80 opacity-20" style="background:radial-gradient(circle at 50% 0,#efb45f,transparent 65%)"></div>

    <header class="relative flex items-center justify-between px-5 pb-2 pt-6">
      <a href="./log-activity.html" class="grid h-10 w-10 place-items-center rounded-full border border-white/8 bg-white/[.035] text-white/55 transition hover:bg-white/[.08] hover:text-white" aria-label="Back to activity form"><i data-lucide="arrow-left" class="h-4 w-4"></i></a>
      <span class="text-sm font-bold">Strength session</span>
      <button class="grid h-10 w-10 place-items-center rounded-full text-white/30 transition hover:text-white" aria-label="More options"><i data-lucide="more-horizontal" class="h-5 w-5"></i></button>
    </header>

    <section class="relative flex-1 overflow-y-auto px-5 pb-32 pt-5">
      <div class="px-2">
        <p class="text-sm text-white/42">Sunday, August 23</p>
        <h1 class="mt-1 text-3xl font-semibold tracking-[-.05em]">Strong, your way.</h1>
      </div>

      <div class="mt-6 grid grid-cols-3 gap-2">
        <label class="rounded-2xl border border-white/8 bg-white/[.035] px-3 py-3 transition focus-within:border-[#efb45f]/40"><span class="flex items-center gap-1 text-[9px] text-white/30"><i data-lucide="timer" class="h-3 w-3"></i>Duration</span><span class="mt-2 flex items-baseline gap-1"><input type="number" x-model.number="duration" class="w-8 bg-transparent text-lg font-semibold outline-none"><small class="text-[9px] text-white/28">min</small></span></label>
        <label class="rounded-2xl border border-white/8 bg-white/[.035] px-3 py-3 transition focus-within:border-[#efb45f]/40"><span class="flex items-center gap-1 text-[9px] text-white/30"><i data-lucide="gauge" class="h-3 w-3"></i>Effort</span><span class="mt-2 flex items-baseline gap-1"><input type="number" min="1" max="10" x-model.number="effort" class="w-6 bg-transparent text-lg font-semibold outline-none"><small class="text-[9px] text-white/28">/ 10</small></span></label>
        <label class="rounded-2xl border border-white/8 bg-white/[.035] px-3 py-3 transition focus-within:border-[#efb45f]/40"><span class="flex items-center gap-1 text-[9px] text-white/30"><i data-lucide="flame" class="h-3 w-3"></i>Estimated</span><span class="mt-2 flex items-baseline gap-1"><input type="number" x-model.number="energy" class="w-10 bg-transparent text-lg font-semibold outline-none"><small class="text-[9px] text-white/28">kcal</small></span></label>
      </div>

      <div class="mt-6 flex items-center justify-between px-2">
        <div><h2 class="text-sm font-bold">Exercises</h2><p class="mt-0.5 text-[10px] text-white/30"><span x-text="exercises.length"></span> exercises · <span x-text="totalSets"></span> sets</p></div>
        <button @click="openExercisePicker()" class="flex items-center gap-1.5 rounded-full border border-white/10 bg-white/[.04] px-3 py-2 text-[10px] font-bold text-white/60 transition hover:border-[#efb45f]/35 hover:text-[#efb45f] active:scale-95"><i data-lucide="plus" class="h-3.5 w-3.5"></i>Add exercise</button>
      </div>

      <div class="mt-3 space-y-3">
        <template x-for="(exercise,ei) in exercises" :key="exercise.id">
          <article class="card-in overflow-hidden rounded-[1.45rem] border border-white/8 bg-white/[.035] shadow-[0_14px_35px_rgba(0,0,0,.16)]">
            <header class="flex items-center gap-3 p-4">
              <span class="grid h-10 w-10 shrink-0 place-items-center rounded-[.9rem] bg-[#2d261d] text-[#efb45f]"><i data-lucide="dumbbell" class="h-4 w-4"></i></span>
              <span class="min-w-0 flex-1"><strong class="block truncate text-sm" x-text="exercise.name"></strong><small class="mt-0.5 block truncate text-[9px] text-white/28" x-text="exercise.previous"></small></span>
              <button @click="removeExercise(ei)" class="grid h-8 w-8 place-items-center rounded-full text-white/20 transition hover:bg-white/[.06] hover:text-white/60" :aria-label="'Remove '+exercise.name"><i data-lucide="x" class="h-3.5 w-3.5"></i></button>
            </header>

            <div class="border-t border-white/7 px-3 pb-3 pt-2">
              <div class="grid grid-cols-[26px_1fr_1fr_30px] items-center gap-2 px-1 py-1 text-center text-[8px] font-bold tracking-[.12em] text-white/22 uppercase">
                <span>Set</span><span x-text="exercise.mode==='duration'?'Time':exercise.mode==='reps'?'Reps':'kg'"></span><span x-text="exercise.mode==='weight'?'Reps':exercise.mode==='weight_duration'?'Time':'Effort'"></span><span></span>
              </div>
              <div class="space-y-1">
                <template x-for="(set,si) in exercise.sets" :key="set.id">
                  <div class="grid grid-cols-[26px_1fr_1fr_30px] items-center gap-2 rounded-xl px-1 py-1.5" :class="set.flash?'new-set':''">
                    <span class="text-center text-[10px] font-bold" :class="si===exercise.sets.length-1?'text-[#efb45f]':'text-white/28'" x-text="si+1"></span>
                    <label class="rounded-lg border border-white/7 bg-black/15 px-2 py-2 text-center focus-within:border-[#efb45f]/40">
                      <input x-show="exercise.mode==='weight' || exercise.mode==='weight_duration'" type="number" step="0.5" x-model.number="set.load" class="w-full bg-transparent text-center text-xs font-semibold outline-none">
                      <input x-show="exercise.mode==='reps'" type="number" x-model.number="set.reps" class="w-full bg-transparent text-center text-xs font-semibold outline-none">
                      <input x-show="exercise.mode==='duration'" type="number" x-model.number="set.seconds" class="w-full bg-transparent text-center text-xs font-semibold outline-none">
                    </label>
                    <label class="rounded-lg border border-white/7 bg-black/15 px-2 py-2 text-center focus-within:border-[#efb45f]/40">
                      <input x-show="exercise.mode==='weight'" type="number" x-model.number="set.reps" class="w-full bg-transparent text-center text-xs font-semibold outline-none">
                      <input x-show="exercise.mode==='weight_duration'" type="number" x-model.number="set.seconds" class="w-full bg-transparent text-center text-xs font-semibold outline-none">
                      <input x-show="exercise.mode==='duration' || exercise.mode==='reps'" type="number" min="1" max="10" x-model.number="set.rpe" class="w-full bg-transparent text-center text-xs font-semibold outline-none">
                    </label>
                    <button @click="removeSet(ei,si)" class="grid h-7 w-7 place-items-center rounded-lg text-white/18 transition hover:bg-white/[.05] hover:text-white/55" aria-label="Remove set"><i data-lucide="trash-2" class="h-3 w-3"></i></button>
                  </div>
                </template>
              </div>
              <button @click="duplicateLast(ei)" class="mt-2 flex w-full items-center justify-center gap-1.5 rounded-xl border border-dashed border-white/10 py-2.5 text-[10px] font-bold text-white/35 transition hover:border-[#efb45f]/35 hover:bg-[#2d261d]/60 hover:text-[#efb45f] active:scale-[.985]"><i data-lucide="copy-plus" class="h-3.5 w-3.5"></i>Duplicate last set</button>
            </div>
          </article>
        </template>
      </div>

      <button @click="openExercisePicker()" class="mt-3 flex w-full items-center justify-center gap-2 rounded-[1.35rem] border border-dashed border-white/12 py-4 text-xs font-bold text-white/40 transition hover:border-[#efb45f]/40 hover:bg-[#2d261d]/50 hover:text-[#efb45f]"><i data-lucide="plus-circle" class="h-4 w-4"></i>Add another exercise</button>
    </section>

    <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-[#101012] via-[#101012] to-transparent px-5 pb-6 pt-8">
      <button @click="save()" class="flex w-full items-center justify-center gap-2 rounded-2xl bg-[#efb45f] py-4 text-sm font-bold text-[#1d160d] shadow-[0_12px_30px_rgba(239,180,95,.16)] transition active:scale-[.98]"><i x-show="!saved" data-lucide="check" class="h-4 w-4"></i><i x-show="saved" data-lucide="sparkles" class="h-4 w-4"></i><span x-text="saved?'Session saved ✓':'Save session'"></span></button>
    </div>

    <div x-show="pickerOpen" x-cloak class="absolute inset-0 z-30 flex items-end" role="dialog" aria-modal="true" aria-label="Choose an exercise">
      <button @click="pickerOpen=false" x-transition.opacity class="absolute inset-0 bg-black/70 backdrop-blur-[2px]" aria-label="Close exercise picker"></button>
      <section x-show="pickerOpen" x-transition:enter="transition duration-300 ease-out" x-transition:enter-start="translate-y-full" x-transition:enter-end="translate-y-0" x-transition:leave="transition duration-200 ease-in" x-transition:leave-start="translate-y-0" x-transition:leave-end="translate-y-full" class="relative max-h-[82%] w-full overflow-y-auto rounded-t-[2rem] border-t border-white/10 bg-[#171719] px-5 pb-7 pt-4 shadow-[0_-20px_60px_rgba(0,0,0,.5)]">
        <div class="mx-auto h-1 w-10 rounded-full bg-white/15"></div>
        <div class="mt-5 flex items-start justify-between">
          <div><p class="text-xs text-white/35">Build your session</p><h2 class="mt-1 text-xl font-semibold tracking-[-.04em]">Choose an exercise</h2></div>
          <button @click="pickerOpen=false" class="grid h-9 w-9 place-items-center rounded-full bg-white/[.05] text-white/40 transition hover:text-white" aria-label="Close"><i data-lucide="x" class="h-4 w-4"></i></button>
        </div>

        <label class="mt-5 flex items-center gap-3 rounded-2xl border border-white/9 bg-black/15 px-4 py-3 focus-within:border-[#efb45f]/45"><i data-lucide="search" class="h-4 w-4 text-white/30"></i><input x-ref="exerciseSearch" x-model="exerciseSearch" type="search" placeholder="Search squat, row, plank…" class="min-w-0 flex-1 bg-transparent text-sm outline-none placeholder:text-white/20"></label>

        <div class="mt-5 flex items-center justify-between"><h3 class="text-[10px] font-bold tracking-[.14em] text-white/28 uppercase" x-text="exerciseSearch?'Results':'Recent & common'"></h3><span class="text-[9px] text-white/20" x-text="filteredCatalog.length+' exercises'"></span></div>
        <div class="mt-2 divide-y divide-white/7 overflow-hidden rounded-2xl border border-white/8 bg-white/[.025]">
          <template x-for="item in filteredCatalog" :key="item.name">
            <button @click="selectExercise(item)" class="group flex w-full items-center gap-3 px-4 py-3 text-left transition hover:bg-white/[.045]">
              <span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-[#2d261d] text-sm font-semibold text-[#efb45f]" x-text="item.name.charAt(0)"></span>
              <span class="min-w-0 flex-1"><strong class="block truncate text-xs" x-text="item.name"></strong><small class="mt-0.5 block text-[9px] text-white/28" x-text="item.meta"></small></span>
              <span class="grid h-7 w-7 place-items-center rounded-full border border-white/10 text-sm text-white/30 transition group-hover:border-[#efb45f]/35 group-hover:text-[#efb45f]">+</span>
            </button>
          </template>
          <p x-show="filteredCatalog.length===0" class="px-4 py-5 text-center text-xs text-white/30">No matching exercise yet.</p>
        </div>

        <div class="mt-4 rounded-2xl border border-[#efb45f]/20 bg-[#2d261d]/65 p-4">
          <div class="flex items-center gap-2"><i data-lucide="sparkles" class="h-4 w-4 text-[#efb45f]"></i><strong class="text-xs">Create your own</strong></div>
          <p class="mt-1 text-[10px] leading-4 text-white/32">Use the search text as its name, then choose how each set is tracked.</p>
          <select x-model="customMode" class="mt-3 w-full rounded-xl border border-white/8 bg-[#171719] px-3 py-3 text-xs text-white outline-none [color-scheme:dark]">
            <option value="weight">Weight & reps</option>
            <option value="reps">Reps only</option>
            <option value="duration">Duration</option>
            <option value="weight_duration">Weight & duration</option>
          </select>
          <button @click="createCustomExercise()" class="mt-3 flex w-full items-center justify-center gap-2 rounded-xl bg-[#efb45f] py-3 text-xs font-bold text-[#1d160d] transition active:scale-[.98]"><i data-lucide="plus" class="h-3.5 w-3.5"></i><span x-text="exerciseSearch.trim() ? 'Create “'+exerciseSearch.trim()+'”' : 'Name your exercise above'"></span></button>
        </div>
      </section>
    </div>
  </main>

  <script>
    function strengthLog() {
      return {
        duration: 55,
        effort: 7,
        energy: 320,
        saved: false,
        pickerOpen: false,
        exerciseSearch: '',
        customMode: 'weight',
        nextId: 20,
        catalog: [
          { name: 'Barbell squat', meta: 'Barbell · weight & reps', mode: 'weight' },
          { name: 'Bench press', meta: 'Barbell · weight & reps', mode: 'weight' },
          { name: 'Deadlift', meta: 'Barbell · weight & reps', mode: 'weight' },
          { name: 'Lat pulldown', meta: 'Machine · weight & reps', mode: 'weight' },
          { name: 'Dumbbell row', meta: 'Dumbbell · weight & reps', mode: 'weight' },
          { name: 'Plank', meta: 'Bodyweight · duration', mode: 'duration' }
        ],
        exercises: [
          { id: 1, name: 'Barbell squat', previous: 'Last time · 60 kg × 8', mode: 'weight', sets: [
            { id: 2, load: 40, reps: 10, flash: false },
            { id: 3, load: 60, reps: 8, flash: false },
            { id: 4, load: 60, reps: 8, flash: false }
          ]},
          { id: 5, name: 'Bench press', previous: 'Last time · 45 kg × 10', mode: 'weight', sets: [
            { id: 6, load: 35, reps: 10, flash: false },
            { id: 7, load: 45, reps: 10, flash: false },
            { id: 8, load: 45, reps: 9, flash: false }
          ]}
        ],
        get totalSets() { return this.exercises.reduce((total, exercise) => total + exercise.sets.length, 0) },
        get filteredCatalog() {
          const query = this.exerciseSearch.trim().toLowerCase();
          return this.catalog.filter(item => !query || item.name.toLowerCase().includes(query));
        },
        openExercisePicker() {
          this.exerciseSearch = '';
          this.pickerOpen = true;
          setTimeout(() => { lucide.createIcons(); this.$refs.exerciseSearch?.focus() }, 80);
        },
        selectExercise(definition) {
          const initialSet = definition.mode === 'duration'
            ? { id: this.nextId++, seconds: 30, rpe: 5, flash: true }
            : definition.mode === 'reps'
              ? { id: this.nextId++, reps: 10, rpe: 5, flash: true }
              : definition.mode === 'weight_duration'
                ? { id: this.nextId++, load: 0, seconds: 30, flash: true }
                : { id: this.nextId++, load: 0, reps: 10, flash: true };
          this.exercises.push({
            id: this.nextId++,
            name: definition.name,
            previous: 'No previous performance',
            mode: definition.mode,
            sets: [initialSet]
          });
          this.pickerOpen = false;
          setTimeout(() => lucide.createIcons(), 0);
        },
        createCustomExercise() {
          const name = this.exerciseSearch.trim();
          if (!name) { this.$refs.exerciseSearch?.focus(); return; }
          this.selectExercise({ name, mode: this.customMode });
        },
        duplicateLast(exerciseIndex) {
          const sets = this.exercises[exerciseIndex].sets;
          const last = sets[sets.length - 1] || { load: 0, reps: 0, seconds: 30, rpe: 5 };
          const copy = { ...last, id: this.nextId++, flash: true };
          sets.push(copy);
          setTimeout(() => { copy.flash = false }, 700);
          setTimeout(() => lucide.createIcons(), 0);
        },
        removeSet(exerciseIndex, setIndex) {
          this.exercises[exerciseIndex].sets.splice(setIndex, 1);
        },
        removeExercise(exerciseIndex) {
          this.exercises.splice(exerciseIndex, 1);
        },
        save() {
          this.saved = true;
          setTimeout(() => window.location.href = './activity.html', 900);
        }
      }
    }
  </script>
</body>
</html>
