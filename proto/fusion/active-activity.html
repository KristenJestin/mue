<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mue — Activity in progress · Amber</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400..700&display=swap');</style>
  <style type="text/tailwindcss">
    @theme { --font-sans:Sora,ui-sans-serif,system-ui,sans-serif; }
    [x-cloak] { display:none !important; }
    .phone { width:min(100%,390px); height:min(844px,100dvh); }
    .orbit { animation:orbit 12s linear infinite; }
    .pulse-soft { animation:pulse-soft 3.2s ease-in-out infinite; }
    .enter { animation:enter .5s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes orbit { to { transform:rotate(360deg); } }
    @keyframes pulse-soft { 0%,100% { transform:scale(.96); opacity:.35; } 50% { transform:scale(1.05); opacity:.8; } }
    @keyframes enter { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion:reduce) { .orbit,.pulse-soft,.enter { animation:none !important; } }
  </style>
</head>
<body class="min-h-screen bg-[#252527] font-sans text-white antialiased sm:flex sm:items-center sm:justify-center sm:p-6">
  <main class="phone relative flex flex-col overflow-hidden bg-[#101012] shadow-2xl sm:rounded-[2.7rem]" x-data="activityTimer()" x-init="init()">
    <div class="pointer-events-none absolute inset-0 opacity-25" :class="running?'pulse-soft':''" style="background:radial-gradient(circle at 50% 43%,#efb45f,transparent 42%)"></div>

    <header class="relative flex items-center justify-between px-5 pb-2 pt-6">
      <a href="./activity.html?timer=active" class="grid h-10 w-10 place-items-center rounded-full border border-white/8 bg-white/[.035] text-white/55 transition hover:bg-white/[.08] hover:text-white" aria-label="Back to activity"><i data-lucide="chevron-down" class="h-4 w-4"></i></a>
      <span class="flex items-center gap-2 text-xs font-bold"><span class="h-1.5 w-1.5 rounded-full" :class="running?'bg-[#efb45f] shadow-[0_0_10px_#efb45f]':'bg-white/25'"></span><span x-text="running?'Active':'Paused'"></span></span>
      <button @click="menuOpen=!menuOpen" class="grid h-10 w-10 place-items-center rounded-full text-white/35 transition hover:bg-white/[.05] hover:text-white" aria-label="Timer options"><i data-lucide="more-horizontal" class="h-5 w-5"></i></button>
      <div x-show="menuOpen" x-cloak @click.outside="menuOpen=false" x-transition class="absolute right-5 top-16 z-20 w-40 rounded-2xl border border-white/10 bg-[#1b1b1e] p-1.5 shadow-2xl"><button @click="discardOpen=true;menuOpen=false" class="flex w-full items-center gap-2 rounded-xl px-3 py-3 text-left text-[10px] font-semibold text-[#e88978] transition hover:bg-white/[.05]"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i>Discard timer</button></div>
    </header>

    <section class="relative flex flex-1 flex-col px-6 pb-7 pt-7">
      <div class="enter text-center">
        <span class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-[#2d261d] text-[#efb45f]"><i :data-lucide="activityIcon" class="h-5 w-5"></i></span>
        <h1 class="mt-4 text-xl font-semibold tracking-[-.04em]" x-text="activityName"></h1>
        <p class="mt-1 text-[10px] text-white/32" x-text="activityContext"></p>
      </div>

      <div class="enter relative mx-auto mt-8 grid h-60 w-60 place-items-center" style="animation-delay:.08s">
        <div class="absolute inset-0 rounded-full border border-white/6"></div>
        <div class="orbit absolute inset-4 rounded-full border border-dashed border-[#efb45f]/20" :class="running?'':'[animation-play-state:paused]'"></div>
        <div class="absolute inset-9 rounded-full border border-white/8 bg-[#131315] shadow-[inset_0_0_45px_rgba(239,180,95,.05),0_20px_60px_rgba(0,0,0,.35)]"></div>
        <div class="relative text-center"><p class="text-[9px] font-bold tracking-[.16em] text-white/28 uppercase">Active time</p><strong class="mt-2 block font-mono text-[2.65rem] font-medium tracking-[-.06em] tabular-nums" x-text="formatted"></strong><p class="mt-2 text-[10px] text-white/30">Started at 18:32</p></div>
      </div>

      <div class="enter mt-8 grid grid-cols-[1fr_1.3fr] gap-3" style="animation-delay:.14s">
        <button @click="toggle()" class="flex items-center justify-center gap-2 rounded-2xl border border-white/10 bg-white/[.045] py-4 text-xs font-bold text-white/65 transition hover:bg-white/[.07] active:scale-[.98]"><i x-show="running" data-lucide="pause" class="h-4 w-4" fill="currentColor"></i><i x-show="!running" data-lucide="play" class="h-4 w-4" fill="currentColor"></i><span x-text="running?'Pause':'Resume'"></span></button>
        <button @click="finish()" class="flex items-center justify-center gap-2 rounded-2xl bg-[#efb45f] py-4 text-xs font-bold text-[#1d160d] shadow-[0_12px_30px_rgba(239,180,95,.16)] transition hover:shadow-[0_15px_36px_rgba(239,180,95,.24)] active:scale-[.98]"><i data-lucide="square" class="h-3.5 w-3.5" fill="currentColor"></i>Finish</button>
      </div>

      <div class="enter mt-auto rounded-[1.35rem] border border-white/8 bg-white/[.03] p-4" style="animation-delay:.2s">
        <div class="flex items-center gap-3"><span class="grid h-9 w-9 place-items-center rounded-xl bg-white/[.05] text-[#efb45f]"><i data-lucide="bell-ring" class="h-4 w-4"></i></span><span class="min-w-0 flex-1"><strong class="block text-[10px]">Available in the background</strong><p class="mt-0.5 text-[9px] leading-4 text-white/28">Pause or finish from the Mue notification.</p></span><span class="rounded-full bg-[#2d261d] px-2 py-1 text-[8px] font-bold text-[#efb45f]">SILENT</span></div>
      </div>
    </section>

    <div x-show="discardOpen" x-cloak class="absolute inset-0 z-30 flex items-end">
      <button @click="discardOpen=false" class="absolute inset-0 bg-black/70 backdrop-blur-[2px]" aria-label="Close confirmation"></button>
      <section x-show="discardOpen" x-transition:enter="transition duration-300 ease-out" x-transition:enter-start="translate-y-full" x-transition:enter-end="translate-y-0" class="relative w-full rounded-t-[2rem] border-t border-white/10 bg-[#18181b] px-6 pb-7 pt-4 shadow-[0_-20px_60px_rgba(0,0,0,.5)]">
        <div class="mx-auto h-1 w-10 rounded-full bg-white/15"></div><span class="mt-6 grid h-11 w-11 place-items-center rounded-2xl bg-[#3a2220] text-[#e88978]"><i data-lucide="trash-2" class="h-5 w-5"></i></span><h2 class="mt-4 text-xl font-semibold tracking-[-.04em]">Discard this timer?</h2><p class="mt-2 text-xs leading-5 text-white/35">The elapsed time will be lost. This cannot be undone.</p><div class="mt-6 grid grid-cols-2 gap-3"><button @click="discardOpen=false" class="rounded-2xl border border-white/10 py-4 text-xs font-bold text-white/55">Keep timer</button><a href="./activity.html" class="flex items-center justify-center rounded-2xl bg-[#e88978] py-4 text-xs font-bold text-[#24100d]">Discard</a></div>
      </section>
    </div>
  </main>

  <script>
    function activityTimer() {
      const params = new URLSearchParams(window.location.search);
      const type = params.get('type') || 'treadmill';
      return {
        type,
        activityName: params.get('name') || 'Treadmill walk',
        activityContext: params.get('context') || 'Indoor · Treadmill',
        elapsed: 1543,
        running: true,
        menuOpen: false,
        discardOpen: false,
        interval: null,
        get activityIcon() {
          return { treadmill:'footprints', walk:'trees', run:'person-standing', cycling:'bike', strength:'dumbbell', other:'shapes' }[this.type] || 'activity';
        },
        init() {
          this.interval = setInterval(() => { if (this.running) this.elapsed++ }, 1000);
          this.$nextTick(() => lucide.createIcons());
        },
        get formatted() {
          const hours = Math.floor(this.elapsed / 3600);
          const minutes = Math.floor((this.elapsed % 3600) / 60);
          const seconds = this.elapsed % 60;
          return [hours, minutes, seconds].map(value => String(value).padStart(2,'0')).join(':');
        },
        toggle() {
          this.running = !this.running;
        },
        finish() {
          const params = new URLSearchParams({ from:'timer', seconds:String(this.elapsed), type:this.type, name:this.activityName });
          window.location.href = './log-activity.html?' + params.toString();
        }
      }
    }
  </script>
</body>
</html>
