<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mue — Progress · Amber</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script><script src="https://unpkg.com/lucide@latest"></script>
  <style>@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400..700&display=swap');</style>
  <style type="text/tailwindcss">@theme{--font-sans:Sora,ui-sans-serif,system-ui,sans-serif}[x-cloak]{display:none!important}.phone{width:min(100%,390px);height:min(844px,100dvh)}</style>
</head>
<body class="min-h-screen bg-[#252527] font-sans text-white antialiased sm:flex sm:items-center sm:justify-center sm:p-6">
  <main class="phone relative flex flex-col overflow-hidden bg-[#101012] shadow-2xl sm:rounded-[2.7rem]" x-data="{timerActive:new URLSearchParams(window.location.search).get('timer')==='active',period:'30 days',periods:['7 days','30 days','3 months','All'],points:[75.6,75.1,75.2,74.8,74.9,74.5],draw(){let c=this.$refs.chart,x=c.getContext('2d'),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;x.scale(d,d);x.clearRect(0,0,w,h);let min=74.2,max=75.9,p=12,px=i=>p+i*(w-p*2)/(this.points.length-1),py=v=>p+(max-v)*(h-p*2)/(max-min);x.strokeStyle='rgba(255,255,255,.07)';x.lineWidth=1;[.25,.5,.75].forEach(k=>{x.beginPath();x.moveTo(0,h*k);x.lineTo(w,h*k);x.stroke()});x.beginPath();this.points.forEach((v,i)=>i?x.lineTo(px(i),py(v)):x.moveTo(px(i),py(v)));x.lineWidth=3;x.strokeStyle='#efb45f';x.lineCap='round';x.lineJoin='round';x.stroke();this.points.forEach((v,i)=>{x.beginPath();x.arc(px(i),py(v),i===this.points.length-1?5:3,0,Math.PI*2);x.fillStyle=i===this.points.length-1?'#f4eee5':'#efb45f';x.fill()})}}" x-init="$nextTick(()=>{draw();lucide.createIcons()})">
    <div class="pointer-events-none absolute inset-x-0 top-0 h-72 opacity-20" style="background:radial-gradient(circle at 50% 0,#efb45f,transparent 65%)"></div>
    <header class="relative flex items-center justify-between px-7 pb-2 pt-7"><a href="../index.html" class="text-sm font-black tracking-[.2em]">MUE</a><span class="text-xs font-semibold text-white/40">August 23, 2026</span></header>
    <section class="relative flex-1 overflow-y-auto px-7 pb-5 pt-8">
      <p class="text-sm text-white/42">Your journey</p><h1 class="mt-1 text-3xl font-semibold tracking-[-.045em]">Slowly, surely.</h1>
      <div class="mt-7 flex gap-2 overflow-x-auto pb-1"><template x-for="p in periods"><button @click="period=p;draw()" class="shrink-0 rounded-full px-4 py-2 text-xs font-semibold transition" :class="period===p?'bg-[#efb45f] text-[#1d160d]':'bg-white/[.05] text-white/40'" x-text="p"></button></template></div>
      <div class="mt-5 rounded-[1.8rem] border border-white/8 bg-white/[.035] p-5 shadow-[0_16px_50px_rgba(0,0,0,.25)]">
        <div class="flex items-end justify-between"><div><span class="text-xs text-white/35">Current weight</span><div class="mt-1 text-4xl font-semibold tracking-[-.06em]">74.5 <span class="text-sm font-medium text-white/30">kg</span></div></div><span class="rounded-full bg-[#33291e] px-3 py-1.5 text-xs font-bold text-[#efb45f]">−1.1 kg</span></div>
        <canvas x-ref="chart" class="mt-5 h-44 w-full"></canvas><div class="flex justify-between text-[10px] font-medium text-white/25"><span>Jul 25</span><span>Today</span></div>
      </div>
      <div class="mt-5 grid grid-cols-2 gap-3"><div class="rounded-2xl border border-white/8 bg-white/[.035] p-4"><span class="text-xs text-white/35">Current BMI</span><strong class="mt-2 block text-2xl">23.0</strong><span class="text-xs text-[#efb45f]">Healthy range</span></div><div class="rounded-2xl bg-[#efb45f] p-4 text-[#1d160d]"><span class="text-xs text-black/50">Average pace</span><strong class="mt-2 block text-2xl">−0.3</strong><span class="text-xs text-black/50">kg / week</span></div></div>
      <h2 class="mt-6 text-sm font-bold">Latest measurements</h2><div class="mt-2 divide-y divide-white/8"><div class="flex justify-between py-3 text-sm"><span class="text-white/40">Today</span><strong>74.5 kg</strong></div><div class="flex justify-between py-3 text-sm"><span class="text-white/40">August 18</span><strong>74.9 kg</strong></div><div class="flex justify-between py-3 text-sm"><span class="text-white/40">August 12</span><strong>74.8 kg</strong></div></div>
    </section>
    <a x-show="timerActive" x-cloak href="./active-activity.html" class="mx-3 mb-2 flex items-center gap-3 rounded-2xl border border-[#efb45f]/30 bg-[#2d261d] px-3 py-2.5 shadow-[0_10px_30px_rgba(0,0,0,.28)]"><span class="grid h-9 w-9 place-items-center rounded-xl bg-[#efb45f] text-[#1d160d]"><i data-lucide="footprints" class="h-4 w-4"></i></span><span class="min-w-0 flex-1"><strong class="block text-[10px]">Treadmill walk</strong><span class="mt-0.5 block text-[9px] text-white/35">Activity in progress</span></span><span class="font-mono text-xs font-semibold tabular-nums text-[#efb45f]">25:43</span><i data-lucide="chevron-right" class="h-3.5 w-3.5 text-white/20"></i></a>
    <nav class="relative grid grid-cols-5 border-t border-white/8 bg-[#121214] px-2 py-2 text-center text-[8px] font-semibold"><a :href="timerActive?'./saisie.html?timer=active':'./saisie.html'" class="flex flex-col items-center gap-1 text-white/28 transition hover:text-white/60"><i data-lucide="scale" class="h-[18px] w-[18px]"></i><span>Entry</span></a><a :href="timerActive?'./evolution.html?timer=active':'./evolution.html'" class="flex flex-col items-center gap-1 text-[#efb45f]"><i data-lucide="chart-no-axes-combined" class="h-[18px] w-[18px]" stroke-width="2.5"></i><span>Progress</span></a><a :href="timerActive?'./activity.html?timer=active':'./activity.html'" class="flex flex-col items-center gap-1 text-white/28 transition hover:text-white/60"><i data-lucide="activity" class="h-[18px] w-[18px]"></i><span>Activity</span></a><a :href="timerActive?'./food.html?timer=active':'./food.html'" class="flex flex-col items-center gap-1 text-white/28 transition hover:text-white/60"><i data-lucide="utensils" class="h-[18px] w-[18px]"></i><span>Food</span></a><a :href="timerActive?'./profil.html?timer=active':'./profil.html'" class="flex flex-col items-center gap-1 text-white/28 transition hover:text-white/60"><i data-lucide="user-round" class="h-[18px] w-[18px]"></i><span>Profile</span></a></nav>
  </main>
</body>
</html>
